<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP</title>
    <link rel="stylesheet" href="aula07_cep.css">
</head>
<body>
    <div class="container">
        <h1>Consulta de CEP</h1>
        <div class="busca">
            <label for="cep">Digite o CEP:</label>
            <input type="text" id="cep" maxlength="8" placeholder="Ex: 89010025">
            <button onclick="buscarCEP()">
                Buscar CEP
            </button>
        </div>
        <div id="resultado"></div>
        <div id="dataConsulta"></div>
        <h2>JSON Retornado pela API</h2>
        <textarea id="jsonDados" readonly></textarea>
    </div>
    <script src="aula07_cep.js"></script>
</body>
</html>
