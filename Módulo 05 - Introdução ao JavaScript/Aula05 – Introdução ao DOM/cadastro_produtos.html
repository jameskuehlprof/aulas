<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="cadastro_produtos.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <div class="formulario">
            <label>Nome do Produto:</label>
            <input type="text" id="produto">
            <label>Preço (R$):</label>
            <input type="number" id="preco" step="0.01">
            <button onclick="adicionarProduto()">
                Adicionar Produto
            </button>
            <button onclick="destacarCaros()">
                Destacar Produtos Caros
            </button>
            <button onclick="mudarCorLista()">
                Alterar Cor da Lista
            </button>
        </div>
        <div class="lista-produtos">
            <h2>Produtos Cadastrados</h2>
            <ul id="lista">
            </ul>
        </div>
    </div>
    <script src="cadastro_produtos.js"></script>
</body>
</html>
