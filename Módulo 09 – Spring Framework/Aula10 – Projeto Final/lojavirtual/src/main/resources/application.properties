spring.application.name=lojavirtual
server.port=8080

# --- Banco de dados MySQL ---
# Antes de rodar: crie o schema "lojavirtual" no MySQL Workbench (ou deixe
# createDatabaseIfNotExist=true criar automaticamente na primeira conexao).
spring.datasource.url=jdbc:mysql://localhost:3306/lojavirtual?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI

# --- JPA / Hibernate ---
# ddl-auto=update: o Hibernate cria/ajusta as tabelas automaticamente a
# partir das entidades @Entity. Em producao isso normalmente NAO se usa
# (prefere-se uma ferramenta de migration, como Flyway) - mas para fins
# didaticos, em desenvolvimento, e extremamente pratico.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carrega o data.sql (dados de exemplo) sempre, DEPOIS do Hibernate criar as
# tabelas (defer-datasource-initialization=true garante essa ordem).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
