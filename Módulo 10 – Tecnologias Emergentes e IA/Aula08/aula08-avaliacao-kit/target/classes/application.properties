spring.application.name=aula08-avaliacao
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# BANCO: MySQL (Workbench). O banco "techfix" e criado sozinho na primeira
# execucao (createDatabaseIfNotExist=true) e as tabelas (usuario, ticket) sao
# criadas/atualizadas pelo Hibernate (ddl-auto=update).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/techfix?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# IA: chaves em variaveis de ambiente (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY). Provedor usado pelo sistema:
# ---------------------------------------------------------------------------
ia.provedor=gemini
ia.claude.modelo=claude-haiku-4-5
ia.openai.modelo=gpt-4o-mini
ia.gemini.modelo=gemini-3.8-flash
ia.max-tokens=500
ia.timeout-segundos=40
ia.historico.tamanho=6

# Cache de respostas (Desafio): liga/desliga e validade em minutos
ia.cache.ativo=true
ia.cache.validade-minutos=60

# Upload da foto do problema (Incremento 4)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
