<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechFix Inteligente – Avaliação Final</title>
<style>
  :root { --verde: #1e5c2e; --fundo: #f4f7f5; --borda: #d7e2da; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: var(--fundo); color: #222; }
  header { background: var(--verde); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; opacity: .85; font-size: 14px; margin-left: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  .painel { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; }
  .btn { background: var(--verde); color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; cursor: pointer; font: inherit; margin-top: 8px; }
  .btn.sec { background: #fff; color: var(--verde); border: 1px solid var(--verde); }
  .ticket { border: 1px solid var(--borda); border-radius: 10px; padding: 10px; margin: 8px 0; background: #fafcfa; }
  .ticket small { color: #666; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; color: #fff; margin-right: 4px; }
  .IA { background: #1e5c2e; } .CACHE { background: #1565c0; } .FALLBACK { background: #b00020; }
  .ALTA { background: #b00020; } .MEDIA { background: #e0a800; } .BAIXA { background: #777; }
  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .m { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 8px; text-align: center; }
  .m b { display: block; font-size: 18px; color: var(--verde); } .m span { font-size: 11px; color: #666; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <strong>🛠️ TechFix Inteligente — Avaliação Final (Aula 08)</strong>
  <span><a href="/swagger-ui.html" target="_blank">Swagger ↗</a></span>
</header>
<main>
  <div class="painel">
    <h3 style="margin-top:0">Usuário</h3>
    <input id="nome" placeholder="Nome"><input id="email" placeholder="E-mail" style="margin-top:6px">
    <button class="btn" id="btnCadastrar">Cadastrar</button>
    <label>Usuário ativo</label><select id="usuario"></select>
    <label>Novo ticket</label>
    <textarea id="texto" rows="3" placeholder="Descreva o problema..."></textarea>
    <button class="btn" id="btnAbrir">Abrir ticket</button>
    <label>Foto do problema (ticket #)</label>
    <input id="ticketId" placeholder="id do ticket" style="margin-bottom:6px"><input type="file" id="foto" accept="image/*">
    <button class="btn sec" id="btnFoto">Enviar foto</button>
    <div class="metricas" id="metricas"></div>
    <button class="btn sec" id="btnMetricas">Atualizar métricas</button>
  </div>
  <div class="painel">
    <h3 style="margin-top:0">Tickets do usuário <button class="btn sec" id="btnLista" style="margin:0;padding:4px 10px">Atualizar</button></h3>
    <div id="lista"></div>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  async function api(url, method = 'GET', body, form) {
    const opt = { method };
    if (form) opt.body = form; else if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    const r = await fetch(url, opt); const j = await r.json();
    if (!r.ok) throw new Error(j.detail || j.title || 'HTTP ' + r.status); return j;
  }
  async function usuarios() { const l = await api('/api/usuarios'); $('usuario').innerHTML = l.map(u => `<option value="${u.id}">${u.nome}</option>`).join(''); }
  $('btnCadastrar').onclick = async () => { try { await api('/api/usuarios', 'POST', { nome: $('nome').value, email: $('email').value }); await usuarios(); } catch (e) { alert(e.message); } };
  function card(t) {
    return `<div class="ticket"><b>#${t.id}</b> ${t.texto}<br><i>${t.resposta || ''}</i>${t.descricaoAnexo ? `<br>📷 ${t.descricaoAnexo}` : ''}<br>
      <span class="tag ${t.origem}">${t.origem}</span><span class="tag ${t.prioridade}">${t.prioridade}</span>
      <small>regras: ${t.categoriaRegras} · IA: ${t.categoriaIa || '-'} · ${t.tempoMs} ms · ${t.tokensEntrada + t.tokensSaida} tokens</small></div>`;
  }
  async function lista() { try { const l = await api(`/api/usuarios/${$('usuario').value}/tickets`); $('lista').innerHTML = l.map(card).join('') || '<small>nenhum ticket</small>'; } catch (e) { $('lista').textContent = e.message; } }
  $('btnLista').onclick = lista;
  $('btnAbrir').onclick = async () => { try { const t = await api('/api/tickets', 'POST', { usuarioId: Number($('usuario').value), texto: $('texto').value }); $('texto').value = ''; $('ticketId').value = t.id; lista(); metricas(); } catch (e) { alert(e.message); } };
  $('btnFoto').onclick = async () => { const fd = new FormData(); fd.append('imagem', $('foto').files[0]); try { await api(`/api/tickets/${$('ticketId').value}/foto`, 'POST', null, fd); lista(); } catch (e) { alert(e.message); } };
  async function metricas() { const m = await api('/api/metricas'); $('metricas').innerHTML = [['Tickets', m.totalTickets], ['Cache %', m.taxaCacheHitPercentual], ['Fallbacks', m.fallbacks], ['IA ms', m.tempoMedioIaMs], ['Alta', m.prioridadeAlta], ['Concord. %', m.concordanciaRegrasIaPercentual]].map(([k, v]) => `<div class="m"><b>${v}</b><span>${k}</span></div>`).join(''); }
  $('btnMetricas').onclick = metricas;
  usuarios().then(() => { lista(); metricas(); });
</script>
</body>
</html>
