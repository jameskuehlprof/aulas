spring.application.name=aula07-atendimento-inteligente
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# BANCO PADRAO: MySQL (Workbench). Crie o banco antes de rodar:
#   CREATE DATABASE atendimento CHARACTER SET utf8mb4;
# As tabelas (usuario, pergunta) sao criadas/atualizadas sozinhas (ddl-auto=update).
# Sem MySQL instalado? Rode com o profile "h2" (nao precisa instalar nada):
#   --spring.profiles.active=h2
#   (Eclipse: Run Configurations > Arguments > Program arguments)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/atendimento?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=false
#spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# IA: chaves em variaveis de ambiente (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY). Provedor usado pelo sistema:
# ---------------------------------------------------------------------------
ia.provedor=gemini
ia.claude.modelo=claude-haiku-4-5
ia.openai.modelo=gpt-4o-mini
ia.gemini.modelo=gemini-3.8-flash
ia.max-tokens=500
ia.timeout-segundos=40
ia.historico.tamanho=6

# Cache de respostas (Desafio): liga/desliga e validade em minutos
ia.cache.ativo=true
ia.cache.validade-minutos=60
