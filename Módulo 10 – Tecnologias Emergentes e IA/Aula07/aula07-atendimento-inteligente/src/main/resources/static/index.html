<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento Inteligente – Aula 07</title>
<style>
  :root { --verde: #1e5c2e; --fundo: #f4f7f5; --borda: #d7e2da; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: var(--fundo); color: #222; }
  header { background: var(--verde); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; opacity: .85; font-size: 14px; margin-left: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  .painel { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; }
  .btn { background: var(--verde); color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; cursor: pointer; font: inherit; margin-top: 8px; }
  .btn.sec { background: #fff; color: var(--verde); border: 1px solid var(--verde); }
  .chat { height: 380px; overflow-y: auto; border: 1px solid var(--borda); border-radius: 10px; padding: 12px; background: #fafcfa; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; margin: 6px 0; white-space: pre-wrap; font-size: 14px; }
  .msg.eu { background: #e3f2e7; margin-left: auto; }
  .msg.lia { background: #f1f1f1; }
  .meta { font-size: 11px; color: #777; margin-top: 4px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
  .IA { background: #1e5c2e; } .CACHE { background: #1565c0; } .FALLBACK { background: #b00020; }
  .linha { display: flex; gap: 8px; margin-top: 10px; }
  .metricas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .m { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 8px; text-align: center; }
  .m b { display: block; font-size: 20px; color: var(--verde); }
  .m span { font-size: 11px; color: #666; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .metricas { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <strong>🤖 TechFix · Atendimento Inteligente — Aula 07</strong>
  <span><a href="/swagger-ui.html" target="_blank">Swagger ↗</a><a href="/h2-console" target="_blank">H2 console ↗</a></span>
</header>
<main>
  <div class="painel">
    <h3 style="margin-top:0">Usuário</h3>
    <label>Cadastrar novo</label>
    <input id="nome" placeholder="Nome">
    <input id="email" placeholder="E-mail" style="margin-top:6px">
    <button class="btn" id="btnCadastrar">Cadastrar</button>
    <label>Usuário ativo</label>
    <select id="usuario"></select>
    <button class="btn sec" id="btnHistorico">Carregar histórico</button>
    <div class="metricas" id="metricas"></div>
    <button class="btn sec" id="btnMetricas">Atualizar métricas</button>
  </div>
  <div class="painel">
    <div class="chat" id="chat"></div>
    <div class="linha">
      <input id="texto" placeholder="Pergunte algo para a Lia (Enter para enviar)">
      <button class="btn" id="btnEnviar" style="margin-top:0">Enviar</button>
    </div>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  async function api(url, method = 'GET', body) {
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = r.status === 204 ? null : await r.json();
    if (!r.ok) throw new Error(j?.detail || j?.title || 'HTTP ' + r.status);
    return j;
  }
  function bolha(texto, quem, meta) {
    const d = document.createElement('div'); d.className = 'msg ' + quem; d.textContent = texto;
    if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.innerHTML = meta; d.appendChild(m); }
    $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  }
  async function carregarUsuarios() {
    const lista = await api('/api/usuarios');
    $('usuario').innerHTML = lista.map(u => `<option value="${u.id}">${u.nome} (${u.email})</option>`).join('');
  }
  $('btnCadastrar').onclick = async () => {
    try { await api('/api/usuarios', 'POST', { nome: $('nome').value, email: $('email').value }); $('nome').value = $('email').value = ''; await carregarUsuarios(); $('usuario').value = $('usuario').lastElementChild?.value; }
    catch (e) { alert(e.message); }
  };
  $('btnHistorico').onclick = async () => {
    $('chat').innerHTML = '';
    try {
      const h = await api(`/api/usuarios/${$('usuario').value}/historico`);
      h.reverse().forEach(p => { bolha(p.texto, 'eu'); bolha(p.resposta, 'lia', metaDe(p)); });
    } catch (e) { bolha('Erro: ' + e.message, 'lia'); }
  };
  function metaDe(p) {
    return `<span class="tag ${p.origem}">${p.origem}</span> ${p.provedor || ''} · ${p.tempoMs} ms · ${p.tokensEntrada + p.tokensSaida} tokens${p.categoria ? ' · #' + p.categoria : ''}`;
  }
  async function enviar() {
    const texto = $('texto').value.trim(); if (!texto || !$('usuario').value) return;
    $('texto').value = ''; bolha(texto, 'eu');
    try { const p = await api('/api/perguntas', 'POST', { usuarioId: Number($('usuario').value), texto }); bolha(p.resposta, 'lia', metaDe(p)); metricas(); }
    catch (e) { bolha('Erro: ' + e.message, 'lia'); }
  }
  $('btnEnviar').onclick = enviar;
  $('texto').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
  async function metricas() {
    const m = await api('/api/metricas');
    $('metricas').innerHTML = [['Perguntas', m.totalPerguntas], ['Cache hit %', m.taxaCacheHitPercentual], ['IA ms', m.tempoMedioIaMs], ['Cache ms', m.tempoMedioCacheMs], ['Fallbacks', m.fallbacks], ['Tokens', m.totalTokens]]
      .map(([k, v]) => `<div class="m"><b>${v}</b><span>${k}</span></div>`).join('');
  }
  $('btnMetricas').onclick = metricas;
  carregarUsuarios().then(metricas);
</script>
</body>
</html>
