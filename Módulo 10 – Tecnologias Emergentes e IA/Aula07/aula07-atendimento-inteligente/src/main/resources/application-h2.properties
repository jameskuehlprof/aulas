# Profile "h2": --spring.profiles.active=h2
# Banco em memoria, sem precisar instalar nada. Util em maquinas sem MySQL
# (ex.: notebook pessoal de um aluno) ou para testes rapidos e isolados.
spring.datasource.url=jdbc:h2:mem:atendimento;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# Console do H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:atendimento)
