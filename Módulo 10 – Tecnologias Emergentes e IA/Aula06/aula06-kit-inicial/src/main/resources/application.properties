spring.application.name=aula06-visao-web
server.port=8080
springdoc.swagger-ui.path=/swagger-ui.html

# Tamanho maximo do upload (fotos de celular costumam ter 2-5 MB)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB

# ---------------------------------------------------------------------------
# Chaves (variaveis de ambiente, NUNCA aqui):
#   GEMINI_API_KEY        - aistudio.google.com/apikey (tem nivel gratuito)
#   ANTHROPIC_API_KEY     - console.anthropic.com
#   OPENAI_API_KEY        - platform.openai.com
#   GOOGLE_VISION_API_KEY - console.cloud.google.com (API Cloud Vision ativada)
# ---------------------------------------------------------------------------

# Modelos multimodais (aceitam imagem + texto no mesmo prompt)
visao.gemini.modelo=gemini-3.8-flash
visao.claude.modelo=claude-haiku-4-5
visao.openai.modelo=gpt-4o-mini

# Provedor usado quando o cliente nao informa nenhum
visao.provedor-padrao=gemini

visao.max-tokens=800
visao.timeout-segundos=60
