spring.application.name=aula05-arena-ia
server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# Chaves de API: NUNCA coloque a chave aqui. Elas sao lidas das variaveis de
# ambiente ANTHROPIC_API_KEY, OPENAI_API_KEY e GEMINI_API_KEY (mesmas da Aula 04).
# No Eclipse: Run > Run Configurations > aba Environment.
# ---------------------------------------------------------------------------

# Modelos usados por cada provedor. Nomes mudam com frequencia: confira em
# platform.claude.com, platform.openai.com e ai.google.dev antes da aula.
ia.claude.modelo=claude-haiku-4-5
ia.openai.modelo=gpt-4o-mini
ia.gemini.modelo=gemini-3.8-flash

# Limite de tokens de SAIDA por resposta (trade-off custo x tamanho da resposta)
ia.max-tokens=600

# Timeout de cada chamada HTTP (segundos)
ia.timeout-segundos=40

# Quantas mensagens anteriores o assistente "lembra" (Desafio)
ia.historico.tamanho=10
